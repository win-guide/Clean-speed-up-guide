<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1d2b"/>
      <stop offset="50%" stop-color="#2b2140"/>
      <stop offset="100%" stop-color="#3a1d4d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f5af0"/>
      <stop offset="100%" stop-color="#2cb67d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <!-- window chrome -->
  <rect x="40" y="40" width="1120" height="220" rx="14" fill="#141420" stroke="#3a3a52" stroke-width="1.5"/>
  <rect x="40" y="40" width="1120" height="38" rx="14" fill="#20202f"/>
  <circle cx="66" cy="59" r="7" fill="#ff5f56"/>
  <circle cx="90" cy="59" r="7" fill="#ffbd2e"/>
  <circle cx="114" cy="59" r="7" fill="#27c93f"/>
  <text x="600" y="64" text-anchor="middle" fill="#8a8aa3" font-family="'SF Mono', Menlo, monospace" font-size="14">zsh — optimize-macos — 120×30</text>

  <!-- terminal body -->
  <text x="70" y="120" fill="#2cb67d" font-family="'SF Mono', Menlo, monospace" font-size="20">$ sudo ./clean-and-speed-up.sh</text>
  <text x="70" y="150" fill="#8a8aa3" font-family="'SF Mono', Menlo, monospace" font-size="16">→ Purging caches...        [OK]</text>
  <text x="70" y="175" fill="#8a8aa3" font-family="'SF Mono', Menlo, monospace" font-size="16">→ Trimming launch agents... [OK]</text>
  <text x="70" y="200" fill="#8a8aa3" font-family="'SF Mono', Menlo, monospace" font-size="16">→ Reclaiming disk space...  [OK]</text>

  <text x="600" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" fill="url(#glow)">Clean · Speed Up · Optimize macOS</text>
</svg>
